
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Pop Wishlist</title>
    <link rel="stylesheet" href="../css/albunsfisicos.css">
</head>
<body>

    <h2 class="era-title">💿 Álbuns</h2>

    <!-- GRID -->
    <section class="card-container grid-1">

        <div class="card" data-id="album1">
            <img src="../src/ÁLBUNS FISICOS/the story begins.jpeg" alt="The Story Begins">
            <p>The Story Begins</p>
            <button class="toggle-btn">Falta</button>
        </div>
    </section>

    <section class="card-container grid-2">

        <div class="card" data-id="album2">
            <img src="../src/ÁLBUNS FISICOS/mint.jpeg" alt="Page Two Mint">
            <p>Page Two - Mint ver.</p>
            <button class="toggle-btn">Falta</button>
        </div>

        <div class="card" data-id="album2.1">
            <img src="../src/ÁLBUNS FISICOS/pink.jpeg" alt="Page Two Pink">
            <p>Page Two - Pink ver.</p>
            <button class="toggle-btn">Falta</button>
        </div>

    </section>

    <section class="card-container grid-3">

        <div class="card" data-id="album3">
            <img src="../src/ÁLBUNS FISICOS/neon magenta.jpeg" alt="Twicecoaster Neon Magenta">
            <p>Twicecoaster Lane 1 - Neon Magenta ver.</p>
            <button class="toggle-btn">Falta</button>
        </div>

        <div class="card" data-id="album3.1">
            <img src="../src/ÁLBUNS FISICOS/apricot.jpeg" alt="Twicecoaster Apricot">
            <p>Twicecoaster Lane 1 - Apricot ver.</p>
            <button class="toggle-btn">Falta</button>
        </div>

        <div class="card" data-id="album3.2">
            <img src="../src/ÁLBUNS FISICOS/TT Christmas.jpeg" alt="Twicecoaster Christmas">
            <p>Twicecoaster Lane 1 - Christmas ver.</p>
            <button class="toggle-btn">Falta</button>
        </div>
    </section>

    <section class="card-container grid-2">

        <div class="card" data-id="album2">
            <img src="../src/ÁLBUNS FISICOS/knock A.jpeg" alt="Page Two Mint">
            <p>Twicecoaster lane 2 - A ver.</p>
            <button class="toggle-btn">Falta</button>
        </div>

        <div class="card" data-id="album2.1">
            <img src="../src/ÁLBUNS FISICOS/knock B.jpeg" alt="Page Two Pink">
            <p>Twicecoaster lane 2 - B ver.</p>
            <button class="toggle-btn">Falta</button>
        </div>

    </section>


    <script src="../../js/javascript.js"></script>

</body>
</html>
